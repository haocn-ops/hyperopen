name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Babashka
        run: |
          BB_VERSION=1.12.197
          curl -fsSL -o bb.tar.gz "https://github.com/babashka/babashka/releases/download/v${BB_VERSION}/babashka-${BB_VERSION}-linux-amd64-static.tar.gz"
          echo "1fff1d97fa08b6b43cb9b4f8726a1c72c3115a15611ab1248d3d57c3c70ed908  bb.tar.gz" | sha256sum -c -
          tar -xzf bb.tar.gz bb
          mkdir -p "$HOME/.local/bin"
          mv bb "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bb" --version

      - name: Cache Clojure Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.shadow-cljs
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn', 'shadow-cljs.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts
          npm run security:npm-contract
          npm run security:ci-contract

      - name: Run CI Test Gate
        id: test_main
        continue-on-error: true
        run: |
          set -o pipefail
          HYPEROPEN_SKIP_BD_DOCS_CHECK=1 npm run test:ci | tee .github/badges/test-main.log

      - name: Run WebSocket Test Gate
        id: test_websocket
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:websocket | tee .github/badges/test-websocket.log

      - name: Release build + bundle budget check (soft)
        id: bundle_budget
        continue-on-error: true
        run: |
          set -o pipefail
          # The release :app build doubles as a compile smoke (advanced-optimization
          # failures don't surface in the dev `compile` the test gate runs). The
          # budget checker then measures the hashed release main.js, but it is a
          # SOFT check: over-target prints a warning + PR annotation and exits 0,
          # so bundle size never fails CI or the Cloudflare deploy. Only a real
          # release build failure trips this step.
          npx shadow-cljs release app
          npm run lint:bundle-budget

      - name: Generate Coverage Report
        id: coverage
        continue-on-error: true
        run: npm run coverage

      - name: Generate Coverage Badge Data
        if: always()
        run: npm run coverage:badge

      - name: Determine Badge Status
        if: always()
        run: |
          if [ "${{ steps.test_main.outcome }}" = "failure" ] || \
             [ "${{ steps.test_websocket.outcome }}" = "failure" ]; then
            echo "TESTS_STATUS_BADGE_MESSAGE=failing" >> "$GITHUB_ENV"
            echo "TESTS_STATUS_BADGE_COLOR=red" >> "$GITHUB_ENV"
          else
            echo "TESTS_STATUS_BADGE_MESSAGE=passing" >> "$GITHUB_ENV"
            echo "TESTS_STATUS_BADGE_COLOR=brightgreen" >> "$GITHUB_ENV"
          fi

      - name: Generate Test Metrics Badge Data
        if: always()
        run: npm run test-metrics:badge

      - name: Upload Coverage Artifact
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn

      - name: Upload Raw Coverage Diagnostics
        if: always() && steps.coverage.outcome == 'failure' && hashFiles('.coverage/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raw-v8-coverage
          path: .coverage
          if-no-files-found: warn

      - name: Fail Workflow If Any Gate Failed
        if: always()
        run: |
          if [ "${{ steps.test_main.outcome }}" = "failure" ] || \
             [ "${{ steps.test_websocket.outcome }}" = "failure" ] || \
             [ "${{ steps.bundle_budget.outcome }}" = "failure" ]; then
            exit 1
          fi

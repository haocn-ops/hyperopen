name: Security

on:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify npm manifest, lock, overrides, install scripts, and authored XSS sinks
        run: |
          npm run security:npm-contract
          npm run security:ci-contract
          npm run security:xss-contract
      - run: npm run security:sbom
      - name: Audit high and critical production vulnerabilities
        run: |
          mkdir -p out/security
          npm audit --omit=dev --audit-level=high --json > out/security/npm-audit.json
      - name: Audit resolved Clojure and Maven dependencies
        run: |
          npm run security:clojure-tree:check
          npm run security:clojure-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-security-artifacts
          path: out/security/
